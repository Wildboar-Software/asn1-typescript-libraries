name: Publish
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "acbio"
          - "acp133"
          - "acse"
          - "ansi-x9-42"
          - "ansi-x9-62"
          - "asn1soap"
          - "attribute-asn1module"
          - "bip"
          - "c1222"
          - "cades"
          - "cap"
          - "casscam"
          - "cbeff"
          - "ccr"
          - "charging"
          - "cif"
          - "cinf"
          - "clacse"
          - "clearance-sponsor-attribute"
          - "cmail"
          - "cmip"
          - "cmp"
          - "cms"
          - "copp"
          - "credssp"
          - "crmf"
          - "device-owner-attribute"
          - "dfr"
          - "ec-private-key"
          - "emrtd"
          - "ers"
          - "ess"
          - "fast-infoset"
          - "ftam"
          - "gdt"
          - "gmi-attributemodule"
          - "goose"
          - "gprs-cdr"
          - "guls"
          - "h248"
          - "isis"
          - "iso-9798-3-sasl"
          - "kerberos5"
          - "ldap"
          - "lawful-intercept"
          - "lpp"
          - "ltans-scvp-extension"
          # - "m3100"
          - "nist-csor"
          - "novell_pkis"
          - "logotypecertextn"
          - "or-address"
          - "pc"
          - "pkcs"
          - "pkinit"
          - "pki-stub"
          # - "pc"
          # - "pkcs"
          # - "pki-stub"
          - "presentation-address"
          - "q932"
          - "sgp22"
          - "sgp32"
          - "smrse"
          - "sle"
          - "spnego"
          - "stanag4406"
          - "sv"
          - "z3950"
          # - "qc"
          # - "rinf"
          # - "rose"
          # - "rtse"
          # - "safecurves-pkix-18"
          # - "scrypt-0"
          # - "scvp"
          # - "sec1"
          # - "sio"
          # - "snmp"
          # - "spkac"
          # - "t38"
          # - "tai"
          # - "tal"
          # - "tcap"
          # - "tsp"
          # - "usm"
          # - "x1080"
          # - "x400"
          # - "x500"
          # - "x700"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm ci
      - name: Install dependencies for ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm install
      - name: Add commit hash to index.mts
        working-directory: packages/${{ matrix.package }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo -e "\nexport const GIT_COMMIT_HASH = \"$COMMIT_HASH\";\n" >> src/index.mts
          cat src/index.mts
      - name: Publish package ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        # --allow-slow-types: because the generate code has way too many examples
        # --verbose: for some reason, it hangs without this.
        # --allow-dirty: just because of package-lock.json and the commit hash
        run: npx jsr publish --allow-slow-types --verbose --allow-dirty
